spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dualexpense}
spring.datasource.username=${DB_USERNAME:dualexpense}
spring.datasource.password=${DB_PASSWORD:dualexpense}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
logging.level.com.dualexpense=INFO
